<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Clarion Signal</title>
  <link rel="stylesheet" href="/static/clarion.css">
</head>
<body>
<div class="auth-wrap">
  <form class="auth" method="post" action="/login">
    <div class="brand">
      <div class="mark">C</div>
      <div><div class="name">Clarion Signal</div><div class="sub">Media Intelligence</div></div>
    </div>
    <h1>Sign in</h1>
    <p class="sub">Analyst workspace access</p>
    
    <div class="field"><label for="u">Username</label><input id="u" name="username" autofocus></div>
    <div class="field"><label for="p">Password</label><input id="p" name="password" type="password"></div>
    <button class="btn" type="submit" style="width:100%; justify-content:center;">Sign in</button>
  </form>
</div>
</body>
</html>
